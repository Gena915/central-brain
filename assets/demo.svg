<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect width="760" height="430" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" fill="#8b949e" font-size="12">central-brain — your agent, with a memory</text>

  <text x="22" y="68" fill="#8b949e">you@laptop</text><text x="118" y="68" fill="#3fb950">~/central-brain</text><text x="250" y="68" fill="#c9d1d9">$</text>
  <text x="266" y="68" fill="#e6edf3">set up my brain</text>

  <text x="22" y="98" fill="#a371f7">brain</text><text x="66" y="98" fill="#c9d1d9">  Welcome! I'll set up your Central Brain in under a minute.</text>

  <text x="66" y="126" fill="#8b949e">→ What should I call you?</text><text x="322" y="126" fill="#e6edf3">Alex</text>
  <text x="66" y="150" fill="#8b949e">→ What language should I reply in?</text><text x="386" y="150" fill="#e6edf3">English</text>
  <text x="66" y="174" fill="#8b949e">→ Where should your brain live?</text><text x="362" y="174" fill="#e6edf3">../my-brain</text><text x="470" y="174" fill="#3fb950">✓</text>

  <text x="66" y="206" fill="#3fb950">✓ Seeded your brain and installed 8 commands.</text>
  <text x="66" y="230" fill="#c9d1d9">Your one habit:</text><text x="196" y="230" fill="#58a6ff">/save</text><text x="242" y="230" fill="#c9d1d9">— save early, save often.</text>
  <text x="66" y="254" fill="#c9d1d9">Restart me and type</text><text x="238" y="254" fill="#58a6ff">/brain</text><text x="294" y="254" fill="#c9d1d9">to begin.</text>

  <line x1="22" y1="280" x2="738" y2="280" stroke="#21262d"/>

  <text x="22" y="312" fill="#8b949e">you@laptop</text><text x="118" y="312" fill="#3fb950">~/central-brain</text><text x="250" y="312" fill="#c9d1d9">$</text>
  <text x="266" y="312" fill="#e6edf3">/brain</text>
  <text x="22" y="340" fill="#a371f7">brain</text><text x="66" y="340" fill="#c9d1d9">  🧠 Brain active. Map loaded: knowledge · work · personal ·</text>
  <text x="66" y="362" fill="#c9d1d9">  ideas · tools · agents · workspaces.  What are we doing?</text>

  <text x="22" y="398" fill="#8b949e">you@laptop</text><text x="118" y="398" fill="#3fb950">~/central-brain</text><text x="250" y="398" fill="#c9d1d9">$</text>
  <rect x="266" y="387" width="9" height="16" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
