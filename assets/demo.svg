<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <rect width="760" height="360" rx="10" fill="#0b0e14" stroke="#232b36"/>
  <rect width="760" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="86" y="23" fill="#8b949e" font-size="12.5">central-brain — your agent, with a memory</text>

  <!-- staggered reveal, loops every 9s -->
  <g>
    <text x="24" y="78" fill="#c9d1d9" opacity="1"><tspan fill="#8b949e">~/central-brain</tspan> $ <tspan fill="#e6edf3">set up my brain</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.044;0.061;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="24" y="112" opacity="1"><tspan fill="#a371f7">brain</tspan> <tspan fill="#c9d1d9">Welcome! I'll set up your brain in under a minute.</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.122;0.139;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="144" opacity="1"><tspan fill="#8b949e">→ What should I call you?</tspan>  <tspan fill="#e6edf3">Alex</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.189;0.206;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="172" opacity="1"><tspan fill="#8b949e">→ What language should I reply in?</tspan>  <tspan fill="#e6edf3">English</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.244;0.261;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="200" opacity="1"><tspan fill="#8b949e">→ Where should your brain live?</tspan>  <tspan fill="#e6edf3">../my-brain</tspan>  <tspan fill="#3fb950">✓</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.300;0.317;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="232" fill="#3fb950" opacity="1">✓ Seeded your brain and installed 8 commands.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.378;0.394;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="260" opacity="1"><tspan fill="#c9d1d9">Your one habit:</tspan> <tspan fill="#58a6ff">/save</tspan><tspan fill="#c9d1d9"> — save early, save often.</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.433;0.450;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>

    <text x="52" y="288" opacity="1"><tspan fill="#c9d1d9">Restart me and type</tspan> <tspan fill="#58a6ff">/brain</tspan> <tspan fill="#c9d1d9">to begin.</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.489;0.506;0.933;0.988;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <line x1="24" y1="312" x2="736" y2="312" stroke="#1c232d"/>
  <text x="24" y="340" fill="#c9d1d9"><tspan fill="#8b949e">~/central-brain</tspan> $ </text>
  <rect x="205" y="329" width="9" height="15" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
